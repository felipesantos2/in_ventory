services:
  adminer:
    image: adminer:6.1.1
    container_name: adminer
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '8080:8080'
    networks:
      - default
    restart: always

  db:
    image: mysql:8.4.8
    container_name: mysql-8.4
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: in_ventory_db
    ports:
      - '3306:3306'
    networks:
      - default
    restart: always

  nginx:
    image: nginx:1.31.6-alpine
    container_name: nginx
    volumes:
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    ports:
      - '3000:80'
    networks:
      - default
    restart: always

  php:
    build:
      context: ./docker
    container_name: php-8.5
    depends_on:
      - nginx
    volumes:
      - .:/app
    networks:
      - default
    restart: always
    user: '1000'

networks:
  default:
    driver: bridge
    name: in_ventory_network

volumes:
  mysql_data:


